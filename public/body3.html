<div class="modal fade" id="mAgri"><div class="modal-dialog modal-xl"><div class="modal-content"><div class="modal-header"><b class="df" id="gT">Novo agricultor</b><button class="btn-close" data-bs-dismiss="modal"></button></div>

  <div class="col-md-5"><label class="fl">Nome completo *</label><input class="inp" id="gNome" title="Digite o nome completo do agricultor"></div>
  <div class="col-md-3"><label class="fl">CPF</label><input class="inp" id="gCpf" title="Digite o CPF (apenas números ou no formato 000.000.000-00)"></div>
  <div class="col-md-2"><label class="fl">RG</label><input class="inp" id="gRg" title="Digite o Registro Geral (RG)"></div>

  <div class="col-md-3"><label class="fl">DAP/CAF</label><input class="inp" id="gDap" title="Digite o número da Declaração de Aptidão (DAP) ou Cadastro Nacional da Agricultura Familiar (CAF)"></div>

  <div class="col-md-3"><label class="fl">Telefone</label><input class="inp" id="gTel" title="Digite o telefone de contato principal"></div>
  <div class="col-md-3"><label class="fl">WhatsApp</label><input class="inp" id="gWha" title="Digite o número do WhatsApp"></div>
  <div class="col-md-6"><label class="fl">E-mail</label><input class="inp" id="gMail" title="Digite o e-mail de contato"></div>
  <div class="col-12 mn mt-2" style="font-size:.64rem;color:var(--am);letter-spacing:.16em">ENDEREÇO</div>
  <div class="col-2"><label class="fl">CEP</label><input class="inp" id="gCep" title="Digite o CEP do endereço"></div>
  <div class="col-4"><label class="fl">Comunidade</label><input class="inp" id="gCom" title="Informe a comunidade onde reside"></div>
  <div class="col-3"><label class="fl">Ramal</label><input class="inp" id="gRam" title="Informe o ramal de acesso, se houver"></div>
  <div class="col-3"><label class="fl">Bairro</label><input class="inp" id="gBai" title="Informe o bairro"></div>
  <div class="col-5"><label class="fl">Rua</label><input class="inp" id="gRua" title="Informe o nome da rua ou avenida"></div>
  <div class="col-2"><label class="fl">Número</label><input class="inp" id="gNum" title="Informe o número da residência"></div>
  <div class="col-5"><label class="fl">Coordenadas GPS</label><input class="inp" id="gGps" placeholder="-1.987, -47.921" title="Informe a latitude e longitude da propriedade (ex: -1.987, -47.921)"></div>
  <div class="col-12 mn mt-2" style="font-size:.64rem;color:var(--am);letter-spacing:.16em">PRODUÇÃO RURAL</div>
  <div class="col-md-4"><label class="fl">Cultura principal</label><input class="inp" id="gCul" title="Descreva a principal cultura produzida"></div>
  <div class="col-2"><label class="fl">Área (ha)</label><input class="inp" id="gAre" title="Informe a área total plantada em hectares"></div>
  <div class="col-3"><label class="fl">Qtd. produzida (t)</label><input class="inp" id="gPro" title="Informe a quantidade aproximada produzida em toneladas"></div>
  <div class="col-3"><label class="fl">Tipo de produção</label><select class="inp" id="gTip" title="Selecione se a produção é vegetal, animal ou mista"><option>Vegetal</option><option>Animal</option><option>Mista</option></select></div>
  <div class="col-md-5 d-flex align-items-end pb-1"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="gFam" checked title="Marque se a produção é proveniente da agricultura familiar"><label class="form-check-label">Agricultura familiar</label></div></div>
  <div class="col-md-7"><label class="fl">Cooperativa vinculada</label><select class="inp" id="gCoop" title="Selecione a cooperativa à qual o agricultor está associado (opcional)"><option value="">— Nenhuma —</option></select></div>
  <div class="col-12 mn mt-2" style="font-size:.64rem;color:var(--am);letter-spacing:.16em">ANEXOS (RG · CPF · CAF · RESIDÊNCIA · FOTOS)</div>
  <div class="col-12"><input type="file" class="inp" multiple title="Selecione os arquivos comprobatórios (RG, CPF, CAF, comprovante de residência, fotos)"></div>
 </div></div>
 <div class="modal-footer"><button class="btn-g" data-bs-dismiss="modal">Cancelar</button><button class="btn-p" onclick="saveAgri()">Salvar cadastro</button></div></div></div></div>
